{{ define "layout" }}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>myrag</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f6f8; color: #1f2937; }
        main { max-width: 1080px; margin: 0 auto; padding: 24px; }
        h1, h2 { margin-top: 0; }
        .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
        .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input, textarea, select { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font: inherit; background: #fff; }
        textarea { min-height: 140px; resize: vertical; }
        button { background: #0f172a; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
        .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .success { background: #dcfce7; color: #166534; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .result { border-top: 1px solid #e2e8f0; padding-top: 14px; margin-top: 14px; }
        .chunk { white-space: pre-wrap; background: #f8fafc; border-radius: 8px; padding: 12px; }
        .meta { color: #475569; font-size: 14px; margin-bottom: 8px; }
    </style>
</head>
<body>
<main>
    <h1>Local RAG system</h1>
    {{ template "index" . }}
</main>
</body>
</html>
{{ end }}
